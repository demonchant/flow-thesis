<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Live market evidence moving through Flow Thesis Ledger</title>
  <desc id="desc">A live Unusual Whales alert moves through typed normalization, explicit rule evaluation, and an auditable thesis state.</desc>
  <defs>
    <linearGradient id="rail" x1="0" x2="1">
      <stop stop-color="#b4ef74"/><stop offset=".55" stop-color="#89d7af"/><stop offset="1" stop-color="#ffcc78"/>
    </linearGradient>
    <radialGradient id="halo"><stop stop-color="#b4ef74" stop-opacity=".2"/><stop offset="1" stop-color="#b4ef74" stop-opacity="0"/></radialGradient>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#070a08" flood-opacity=".42"/></filter>
    <style>
      .rail-flow{stroke-dasharray:2 21;animation:flow 1.15s linear infinite}
      .node-ring{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
      .node-ring.delay-1{animation-delay:.7s}.node-ring.delay-2{animation-delay:1.4s}.node-ring.delay-3{animation-delay:2.1s}
      .travel-dot{filter:url(#soft-glow)}
      @keyframes flow{to{stroke-dashoffset:-46}}
      @keyframes pulse{0%{transform:scale(.82);opacity:.65}75%,100%{transform:scale(1.32);opacity:0}}
      @media(prefers-reduced-motion:reduce){.rail-flow,.node-ring{animation:none}.rail-flow{stroke-dasharray:5 19}}
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="26" fill="#131918" stroke="#303a35"/>
  <path d="M40 286H1160M40 72H1160" stroke="#25302b" stroke-width="1" stroke-dasharray="3 12"/>
  <circle cx="104" cy="176" r="100" fill="url(#halo)" opacity=".8"/>
  <circle cx="1094" cy="176" r="110" fill="url(#halo)" opacity=".5"/>

  <path d="M105 176H1095" stroke="#303a35" stroke-width="12" stroke-linecap="round"/>
  <path d="M105 176H1095" stroke="url(#rail)" stroke-width="4" stroke-linecap="round" opacity=".92"/>
  <path class="rail-flow" d="M105 176H1095" stroke="#efffce" stroke-width="8" stroke-linecap="round" opacity=".95"/>
  <circle class="travel-dot" r="7" fill="#f4ffd9">
    <animateMotion dur="4.8s" repeatCount="indefinite" path="M105 176H1095"/>
  </circle>
  <circle class="travel-dot" r="4" fill="#b4ef74" opacity=".82">
    <animateMotion dur="4.8s" begin="-2.4s" repeatCount="indefinite" path="M105 176H1095"/>
  </circle>

  <g font-family="Inter,ui-sans-serif,system-ui,sans-serif">
    <g transform="translate(105 176)" filter="url(#card-shadow)">
      <circle class="node-ring" r="55" fill="none" stroke="#b4ef74" stroke-width="2"/>
      <circle r="42" fill="#202a23" stroke="#b4ef74" stroke-width="2"/>
      <path d="M-21 5c10 0 10-21 21-21s10 33 21 33" fill="none" stroke="#c8f89a" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-21" cy="5" r="3.5" fill="#b4ef74"/><circle cy="-16" r="3.5" fill="#f6ffd9"/><circle cx="21" cy="17" r="3.5" fill="#ffcc78"/>
      <text x="0" y="88" text-anchor="middle" fill="#eff4ed" font-size="17" font-weight="700">UW FLOW ALERT</text>
      <text x="0" y="111" text-anchor="middle" fill="#9fac9f" font-size="12" letter-spacing="1.6">LIVE OBSERVATION</text>
    </g>
    <g transform="translate(435 176)" filter="url(#card-shadow)">
      <circle class="node-ring delay-1" r="55" fill="none" stroke="#94deb1" stroke-width="2"/>
      <circle r="42" fill="#1d2925" stroke="#94deb1" stroke-width="2"/>
      <rect x="-19" y="-19" width="38" height="38" rx="6" fill="none" stroke="#bcebd1" stroke-width="2.5"/>
      <path d="M-11-8h22M-11 0h22M-11 8h14" stroke="#bcebd1" stroke-width="2.5" stroke-linecap="round"/>
      <text x="0" y="88" text-anchor="middle" fill="#eff4ed" font-size="17" font-weight="700">NORMALIZE</text>
      <text x="0" y="111" text-anchor="middle" fill="#9fac9f" font-size="12" letter-spacing="1.6">TYPED EVIDENCE</text>
    </g>
    <g transform="translate(765 176)" filter="url(#card-shadow)">
      <circle class="node-ring delay-2" r="55" fill="none" stroke="#ffcc78" stroke-width="2"/>
      <circle r="42" fill="#29261f" stroke="#ffcc78" stroke-width="2"/>
      <path d="M-20-16h40M-20 0h27M-20 16h16" stroke="#ffdda4" stroke-width="3" stroke-linecap="round"/>
      <circle cx="15" cy="0" r="5" fill="#ffcc78"/>
      <text x="0" y="88" text-anchor="middle" fill="#eff4ed" font-size="17" font-weight="700">TEST THE RULE</text>
      <text x="0" y="111" text-anchor="middle" fill="#9fac9f" font-size="12" letter-spacing="1.6">DETERMINISTIC</text>
    </g>
    <g transform="translate(1095 176)" filter="url(#card-shadow)">
      <circle class="node-ring delay-3" r="55" fill="none" stroke="#b4ef74" stroke-width="2"/>
      <circle r="42" fill="#202a23" stroke="#b4ef74" stroke-width="2"/>
      <path d="M-20 18V-2l13-10 11 7 17-20" fill="none" stroke="#d5f7ae" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="21" cy="-25" r="4" fill="#ffcc78"/>
      <text x="0" y="88" text-anchor="middle" fill="#eff4ed" font-size="17" font-weight="700">THESIS LEDGER</text>
      <text x="0" y="111" text-anchor="middle" fill="#9fac9f" font-size="12" letter-spacing="1.6">AUDITABLE STATE</text>
    </g>
  </g>
  <text x="600" y="326" text-anchor="middle" fill="#78877c" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="2.2">OBSERVE  ·  NORMALIZE  ·  EVALUATE  ·  RECORD</text>
</svg>
